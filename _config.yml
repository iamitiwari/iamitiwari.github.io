encoding: "utf-8"
markdown: kramdown

url: "https://iamitiwari.github.io"
baseurl: ""
title: "Amit Tiwari"
description: "Personal website of Amit Tiwari — about, readings, research and random notes."
author: "Amit Tiwari"

# Theme colours (Skylight Jekyll Theme) — warm peach/terracotta scheme.
# Surface and text colours live in css/main.css (:root variables).
primary-color: "#B8552F"        # terracotta: buttons, borders, current-menu marker
primary-dark-color: "#8F3F22"   # deeper terracotta: links, hover
accent-color: "#F6C4A8"         # soft peach: hover backgrounds, photo ring

permalink: /:categories/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

plugins:
  - jekyll-sitemap
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - THIRD-PARTY-NOTICES.md
